name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: github/codeql-action/init@b5ebac6f6c453405c43a81e7b8e110c84979424d # v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@b5ebac6f6c453405c43a81e7b8e110c84979424d # v3
