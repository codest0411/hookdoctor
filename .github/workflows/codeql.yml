name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@b5ebac6f6c453405c43a81e7b8e110c84979424d # v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@b5ebac6f6c453405c43a81e7b8e110c84979424d # v3
