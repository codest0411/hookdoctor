name: False positive / rule feedback
description: Report an inaccurate finding or missing manager layout
title: "[False Positive]: "
labels: ["false-positive"]
body:
  - type: input
    id: rule
    attributes:
      label: Rule ID (e.g. HD001)
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Repository layout & hookdoctor output
      description: Please share sanitized output of `hookdoctor --format json` (remove any private paths).
    validations:
      required: true
