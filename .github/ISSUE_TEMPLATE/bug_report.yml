name: Bug report
description: Report a bug or unexpected crash in hookdoctor
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: What happened vs what you expected.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Node version, Git version, hookdoctor version, and hook manager used.
    validations:
      required: true
